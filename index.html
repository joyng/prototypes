<!DOCTYPE html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDXO prototypes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap">
<style>
:root{--text:#242128;--subtle:#625e68;--primary:#6b4feb;--primary-dark:#523abc;--border:#dfdfdf;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 "Inter",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:24px}
.eyebrow{font:500 12px/20px "JetBrains Mono",monospace;color:var(--primary-dark)}
h1{margin:0;font-size:40px;font-weight:600}
p{margin:0;color:var(--subtle)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a.card{display:flex;flex-direction:column;gap:4px;padding:20px;border:1px solid var(--border);border-radius:8px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--primary)}
a.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a.card strong{font-size:18px;font-weight:600;color:var(--primary-dark)}
</style>
</head>
<body>
<main>
  <div class="eyebrow">CDXO · GovTech Singapore</div>
  <h1>Prototypes</h1>
  <p>Interactive prototypes for discussion. Data and processing are simulated.</p>
  <ul>
    <li><a class="card" href="smart-drop-zone/"><strong>Smart Drop Zone</strong><span>SGDS file-upload component that converts, checks and explains uploads in the browser, with an optional AgentBase agent layer.</span></a></li>
  </ul>
</main>
</body>
</html>
